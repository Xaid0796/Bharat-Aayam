<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Aayam - Real-time News Portal</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Get real-time, curated Indian news from Bharat Aayam. Stay updated on national politics, sports, entertainment, tech, business, and global events.">
  <meta name="keywords" content="Bharat Aayam, Indian news, politics, sports, entertainment, tech, business news, live updates, GNews">
  <meta name="author" content="Bharat Aayam">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bharat Aayam - Real-time News Portal">
  <meta property="og:description" content="Stay informed with real-time news across politics, sports, entertainment, technology, and business.">
  <meta property="og:image" content="./logo.png">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Bharat Aayam - Real-time News Portal">
  <meta property="twitter:description" content="Stay informed with real-time news across politics, sports, entertainment, technology, and business.">
  <meta property="twitter:image" content="./logo.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <!-- Header Section -->
  <header id="main-header">
    <div class="container header-content">
      <a href="#" class="logo-link" onclick="resetToHome(event)">
        <div class="logo-wrapper">
          <img src="./logo.png" alt="Bharat Aayam Logo" class="logo-img" id="brand-logo-img" onerror="handleLogoError()">
          <div class="logo-fallback" id="brand-logo-fallback">BA</div>
        </div>
        <h1 class="brand-title">Bharat Aayam<span class="pulse-dot"></span></h1>
      </a>
      
      <div class="nav-controls">
        <!-- Search Toggle -->
        <button class="control-btn" id="search-toggle-btn" aria-label="Toggle Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Bookmarks Toggle -->
        <button class="control-btn" id="bookmark-toggle-btn" aria-label="Show Bookmarked Articles">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>

        <!-- Archive Toggle -->
        <button class="control-btn" id="archive-nav-btn" onclick="openArchive()" aria-label="Open Archive" title="Open Archive">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <line x1="10" y1="12" x2="14" y2="12"></line>
          </svg>
        </button>

        <!-- Language Translator Switcher Toggle -->
        <button class="control-btn lang-btn" id="lang-toggle-btn" aria-label="Toggle Language" title="Translate to Hindi">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="lang-toggle-text">हिं</span>
        </button>

        <!-- Dark/Light Theme Toggle -->
        <button class="control-btn theme-toggle" id="theme-toggle-btn" aria-label="Toggle Theme">
          <!-- Light Mode Icon (Sun) -->
          <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Dark Mode Icon (Moon) -->
          <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Expandable Search Bar Drawer -->
  <div class="search-drawer" id="search-drawer">
    <div class="container search-container">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" id="search-field" placeholder="Search news by title or content...">
        <button class="clear-search-btn" id="clear-search-btn" aria-label="Clear Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Horizontal Scrollable Category Bar -->
  <section class="category-section">
    <div class="container category-bar-wrapper" id="category-bar-wrapper">
      <div class="category-bar" id="category-bar">
        <button class="category-btn active" data-category="national">
          Trendings
        </button>
        <button class="category-btn" data-category="politics">
          Politics
        </button>
        <button class="category-btn" data-category="sports">
          Sports
        </button>
        <button class="category-btn" data-category="entertainment">
          Entertainment
        </button>
        <button class="category-btn" data-category="tech">
          Tech
        </button>
        <button class="category-btn" data-category="business">
          Business
        </button>
        <button class="category-btn" data-category="health">
          Health
        </button>
        <button class="category-btn" data-category="science">
          Science
        </button>
        <button class="category-btn" data-category="world">
          World
        </button>
      </div>
    </div>
  </section>

  <!-- Offline Connection Banner -->
  <div class="offline-banner" id="offline-banner">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"></path>
      <path d="M5 12.5a10.94 10.94 0 0 1 5.83-2.84"></path>
      <path d="M7.07 14.57a7.43 7.43 0 0 1 1.95-1.57"></path>
      <path d="M16.24 16.24a7.4 7.4 0 0 1-5.12 1.35"></path>
      <path d="M10.25 18.5a3.63 3.63 0 0 1 3.5 0"></path>
    </svg>
    <span>Internet disconnected. Showing cached news.</span>
    <button onclick="checkConnectionRetry()">Retry</button>
  </div>

  <!-- Main News Content -->
  <main>
    <div class="container">
      <!-- Section Title & Counter -->
      <div class="section-header">
        <h2 class="section-title" id="section-title">Trending Headlines</h2>
        <span class="article-count" id="article-count" style="display: none;">0 Articles</span>
      </div>

      <!-- News Cards Display Grid -->
      <div class="news-grid" id="news-grid">
        <!-- Rendered articles or Skeletons go here dynamically -->
      </div>

      <!-- Load More Button Container -->
      <div class="load-more-container" id="load-more-container" style="display: flex; justify-content: center; margin-top: 40px; margin-bottom: 40px; width: 100%;">
        <button id="load-more-btn" style="padding: 14px 40px; background: var(--gradient-brand); color: #fff; border: none; border-radius: 30px; font-size: 15px; font-weight: 700; font-family: var(--font-body); cursor: pointer; box-shadow: 0 4px 15px rgba(255,111,60,0.35); transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 0.5px;"
          onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 25px rgba(255,111,60,0.45)'"
          onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 15px rgba(255,111,60,0.35)'">
          🔄 Load More Articles
        </button>
      </div>

      <!-- Previous Headlines / Archive Link Banner -->
      <div class="archive-link-banner" id="archive-link-banner">
        <p>Looking for older news?</p>
        <button class="archive-open-btn" onclick="openArchive()" id="archive-open-btn">
          View Previous Headlines &rarr;
        </button>
      </div>

    </div>
  </main>

  <!-- Floating Scroll To Top Button -->
  <button id="scroll-to-top" class="scroll-to-top-btn" aria-label="Scroll to Top">
    <svg class="progress-ring" width="52" height="52">
      <!-- Outer/background track -->
      <circle class="progress-ring__circle-bg" stroke="var(--border-color)" stroke-width="3" fill="transparent" r="22" cx="26" cy="26"></circle>
      <!-- Foreground indicator -->
      <circle class="progress-ring__circle" stroke="var(--primary)" stroke-width="3" fill="transparent" r="22" cx="26" cy="26" id="progress-indicator"></circle>
    </svg>
    <span class="arrow-icon">↑</span>
  </button>

  <!-- Archive Full-Page Overlay -->
  <div class="archive-overlay" id="archive-overlay">
    <!-- Archive Header -->
    <div class="archive-header">
      <div class="archive-header-left" style="display: flex; align-items: center; gap: 12px;">
        <button id="archive-back-btn" class="archive-back-btn" onclick="showArchiveSidebarOnMobile()" aria-label="Back to Dates">
          ← Dates
        </button>
        <div>
          <h2>News Archive</h2>
          <p id="archive-header-subtitle">Browse all previously collected headlines</p>
        </div>
      </div>
      <button class="archive-close-btn" onclick="closeArchive()" aria-label="Close Archive">&times;</button>
    </div>

    <!-- Archive Search Bar -->
    <div class="archive-search-bar">
      <div class="archive-search-wrapper">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="archive-search-input" id="archive-search-input"
          placeholder="Search all headlines by title, source, or category..."
          oninput="onArchiveSearch(this.value)">
      </div>
    </div>

    <!-- Archive Body -->
    <div class="archive-body">
      <!-- Left Sidebar: date navigator -->
      <div class="archive-sidebar" id="archive-sidebar">
        <!-- Populated by JS -->
      </div>

      <!-- Right Panel: articles for selected date -->
      <div class="archive-articles-panel" id="archive-articles-panel">
        <div class="archive-empty">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Select a date from the left to view headlines</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Message Container -->
  <div class="toast-container" id="toast">
    <span id="toast-message">Link copied to clipboard!</span>
  </div>

  <!-- Footer Section -->
  <footer>
    <div class="container footer-content">
      <div class="footer-logo">Bharat Aayam</div>
      <p class="footer-links">
        <a href="#" onclick="resetToHome(event)" id="footer-link-home">Home</a>
        <a href="#" onclick="showBookmarksOnly()" id="footer-link-bookmarks">Bookmarks</a>
      </p>
      <div class="copyright">
        &copy; 2026 Bharat Aayam.
      </div>
    </div>
  </footer>

  <!-- Web Application Scripts -->
  <script src="script.js"></script>
</body>
</html>
